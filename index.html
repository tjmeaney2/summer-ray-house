<style>
:root{--paper:#F4EEE2;--surface:#FBF7EF;--ink:#1C1B18;--ink-muted:#5C5A52;--pine:#1E4B3C;--pine-soft:#EAF0EC;--ochre:#DE8A2C;--ochre-ink:#20160A;--muted:#8A8578;--hairline:#DED7C7;--flag:#B4472E;--on-ink:#F4EEE2;--display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--r:18px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;font-size:17px}
a{color:var(--pine)}
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:32px 28px;text-align:center}
.gate h1{font-family:var(--display);font-weight:500;font-size:30px;margin:8px 0 4px;letter-spacing:-.01em}
.gate p{color:var(--ink-muted);margin:0 0 20px;font-size:15px}
.gate .k{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--pine);color:var(--on-ink);font-family:var(--display);font-size:24px;position:relative}
.gate .k::after{content:"";position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--ochre);border:2px solid var(--surface)}
.gate input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:1px solid var(--hairline);border-radius:12px;background:#fff;color:var(--ink);text-align:center;letter-spacing:.04em}
.gate input:focus{outline:2px solid var(--pine);outline-offset:1px;border-color:var(--pine)}
.gate button{width:100%;margin-top:12px;font:inherit;font-weight:600;font-size:17px;padding:14px 16px;border:0;border-radius:12px;background:var(--ochre);color:var(--ochre-ink);cursor:pointer}
.gate button:active{transform:translateY(1px)}
.gate .err{color:var(--flag);font-size:14px;min-height:20px;margin:10px 0 0}
.gate .hint{font-size:13px;color:var(--muted);margin-top:14px}
#app{display:none}
</style>

<script>
(function(){
  var P=JSON.parse(document.getElementById('payload').textContent);
  var b64=function(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
  var enc=new TextEncoder(),dec=new TextDecoder();
  function open(pw){
    pw=pw.trim().toLowerCase();
    return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.rounds,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));}).then(function(buf){return dec.decode(buf);});
  }
  function show(html){
    var app=document.getElementById('app');app.innerHTML=html;document.getElementById('gate').remove();app.style.display='block';
    var scripts=app.querySelectorAll('script');scripts.forEach(function(s){var n=document.createElement('script');n.textContent=s.textContent;s.replaceWith(n);});
    route();window.addEventListener('hashchange',route);
    try{sessionStorage.setItem('gate-ok',document.getElementById('pw')?'':'')}catch(e){}
  }
  function route(){
    var id=(location.hash||'#home').slice(1);var secs=document.querySelectorAll('#app section[data-page]');var hit=false;
    secs.forEach(function(s){var on=s.id===id;s.hidden=!on;if(on)hit=true;});
    if(!hit){secs.forEach(function(s){s.hidden=s.id!=='home';});}
    window.scrollTo(0,0);document.title=(document.querySelector('#app section:not([hidden]) h1')||{}).textContent||P.title;
  }
  document.getElementById('gateform').addEventListener('submit',function(e){
    e.preventDefault();var btn=this.querySelector('button');btn.disabled=true;btn.textContent='Opening…';document.getElementById('err').textContent='';
    var pw=document.getElementById('pw').value;
    open(pw).then(function(html){try{sessionStorage.setItem('gate-pw',pw)}catch(e){};show(html);}).catch(function(){
      document.getElementById('err').textContent='That is not it. Try again.';btn.disabled=false;btn.textContent='Open';document.getElementById('pw').select();
    });
  });
  try{var saved=sessionStorage.getItem('gate-pw');if(saved){open(saved).then(show).catch(function(){});}}catch(e){}
})();
</script>
